[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "heisenberg"
version = "0.1.0"
description = "Uncertainty principle for star formation - Python implementation of the Heisenberg code"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Heisenberg Team"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "astropy>=5.0",
    "numpy>=1.20",
    "scipy>=1.7",
    "matplotlib>=3.5",
    "click>=8.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "tqdm>=4.0",
    "regions>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black",
    "ruff",
    "mypy",
]
interactive = ["rich>=13.0", "pyds9>=1.8"]
jupyter = ["ipywidgets>=8.0", "jupyterlab>=4.0"]
all = ["heisenberg[dev,interactive,jupyter]"]

[project.scripts]
heisenberg = "heisenberg.cli:main"

[project.urls]
Homepage = "https://github.com/heisenberg-code/heisenberg"
Documentation = "https://heisenberg.readthedocs.io"
Repository = "https://github.com/heisenberg-code/heisenberg"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
